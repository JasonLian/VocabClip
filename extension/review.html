<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VocabClip 每日复习</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="panel">
      <div class="hero"><span class="mark">V</span><div><h1>每日复习</h1><div id="summary" class="muted">正在读取到期单词</div></div></div>
      <div class="progress"><div id="progressBar" style="width:0"></div></div>
      <div id="empty" hidden>
        <p>今天没有需要复习的单词。</p>
        <button id="openNotebook" class="secondary">打开单词本</button>
      </div>
      <div id="reviewCard" hidden>
        <div id="term" class="card-term"></div>
        <div id="ipa" class="ipa"></div>
        <div id="sourceContext" class="source-box"></div>
        <div class="actions"><button id="reveal" class="primary">显示答案</button></div>
        <div id="answer" class="answer" hidden></div>
        <div id="ratings" class="actions" hidden>
          <button data-rating="forgot" class="danger">忘记</button>
          <button data-rating="fuzzy" class="secondary">模糊</button>
          <button data-rating="known" class="primary">认识</button>
        </div>
      </div>
      <div id="status" class="status" hidden></div>
    </section>
  </main>
  <script type="module" src="review.js"></script>
</body>
</html>
