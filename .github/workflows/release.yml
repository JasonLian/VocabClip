name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - package.json

permissions:
  contents: write

concurrency:
  group: vocabclip-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - run: npm run package:release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          ASSET="release/VocabClip-${VERSION}-macos.zip"
          NOTES="复习改为直接在扩展弹窗内完成：评分后继续下一张卡片，提醒不再新开复习页面；同时收紧卡片间距并放大正文。"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping."
          else
            gh release create "$VERSION" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "VocabClip $VERSION" \
              --notes "$NOTES" \
              --generate-notes \
              --latest
          fi
